name: pr-title
# The CHANGELOG comes from squash-merged PR titles: each title must be a conventional commit.
on:
  pull_request_target: # reads only the title; never checks out the PR code
    types: [opened, reopened, edited]
permissions:
  pull-requests: read
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
