name: pr-title
# The CHANGELOG comes from squash-merged PR titles: each title must be a conventional commit.
on:
  pull_request_target: # reads only the title; never checks out the PR code
    types: [opened, reopened, edited]
permissions:
  pull-requests: read
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
